name: Learn CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  first-job:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Print a message
        run: echo "My first GitHub Actions workflow"